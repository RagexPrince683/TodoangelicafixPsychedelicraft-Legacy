processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    filesMatching('mcmod.info') {
        expand (
                'modVersion': project.version,
                'minecraftVersion': project.minecraft.version,
                'modName': project.name
        )
    }
}

tasks.named('jar', Jar) {
    manifest {
        attributes(
                'FMLCorePlugin': 'ivorius.psychedelicraftcore.PsychedelicraftLoadingPlugin',
                'FMLCorePluginContainsFMLMod': 'true',
                'ModSide': 'BOTH',
                'Specification-Title': project.name,
                'Specification-Version': '1',
                'Implementation-Version': project.version
        )
    }
    archiveBaseName = 'DHPsychedelicraft'
}


tasks.register("copyMods", Copy) {
    dependsOn tasks.named("extractUserDev") // вместо строки
    from configurations.provided
    minecraft.runs.client.workingDirectory.toPath().resolve("mods")
    mustRunAfter "deobfBinJar"
    mustRunAfter "repackMinecraft"
}

def clientDevMods = files(fileTree(dir: "devmods/client", include: ["*.jar"]))

// Opt-in, pinned compatibility run; never a published or dedicated-server dependency.
configurations.create("angelicaClient")
if (project.hasProperty("angelicaDev")) {
    dependencies.add("angelicaClient", "com.github.GTNewHorizons:Angelica:2.1.29:dev")
    dependencies.add("angelicaClient", "com.github.GTNewHorizons:GTNHLib:0.11.4:dev")
    // GTNHLib already supplies UniMixins; adding the older all-in-one artifact
    // alongside it makes Forge reject duplicate mod IDs.
}

tasks.named("runClient").configure {
    classpath += clientDevMods
    if (project.hasProperty("angelicaDev")) classpath += configurations.angelicaClient
}
